[project]
name = "limen"
version = "0.1.0"
description = "LIMEN — voice-first postoperative follow-up for Tech Sphere Challenge 2026"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LIMEN Contributors" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.12",
  "pymupdf>=1.24.0",
  "pytesseract>=0.3.10",
  "pillow>=10.0.0",
  "qdrant-client>=1.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "openpyxl>=3.1.0",
]
# Prefer `python scripts/install_embeddings_cpu.py` (or `make bootstrap`) so
# PyTorch is installed from the official CPU wheel index — not CUDA wheels.
embeddings = [
  "sentence-transformers>=3.0.0",
]
# Opt-in local voice stack (CI stays on stub STT/TTS).
voice = [
  "faster-whisper>=1.1.0",
  "piper-tts>=1.2.0",
  "numpy>=1.26.0",
  # CUDA 12 user-space libs for CTranslate2 on hosts with system CUDA 13.
  "nvidia-cublas-cu12",
  "nvidia-cudnn-cu12==9.*",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["limen"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["limen", "apps", "tests", "scripts", "evals"]

[tool.ruff.lint.isort]
known-first-party = ["limen", "apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"evals/*.py" = ["E402"]
"tests/unit/test_official_dataset_phase5c2.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "."
packages = ["limen", "apps"]
exclude = ["runtime/", "apps/web/"]

[[tool.mypy.overrides]]
module = [
  "qdrant_client.*",
  "sentence_transformers.*",
  "fitz",
  "pytesseract",
  "numpy",
  "numpy.*",
  "faster_whisper",
  "faster_whisper.*",
  "ctranslate2",
  "ctranslate2.*",
  "piper",
  "piper.*",
  "torch",
  "torch.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["apps.api.*"]
ignore_missing_imports = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "real_embeddings: requires sentence-transformers + model download (LIMEN_REAL_EMBEDDINGS=1)",
  "real_llm: requires local Ollama + G3-allowed model (LIMEN_REAL_LLM=1)",
  "real_voice: requires local STT/TTS models (LIMEN_REAL_VOICE=1)",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "openpyxl>=3.1.0",
]
